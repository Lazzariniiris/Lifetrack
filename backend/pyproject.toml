[project]
name = "lifetrack-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.12", "openai>=2.0.0", "httpx>=0.28.0"
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
